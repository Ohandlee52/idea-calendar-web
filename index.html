<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#5b6ef5" />
  <title>아이디어 캘린더</title>

  <!-- 카톡 등으로 링크를 보낼 때 미리보기 카드에 쓰는 정보.
       og:image 는 상대경로가 아니라 실제 주소 전체를 써야
       카톡이 이미지를 제대로 가져온다. -->
  <meta property="og:title" content="아이디어 캘린더" />
  <meta property="og:description" content="생각날때마다 바로바로 메모하세용!" />
  <meta property="og:image" content="https://ohandlee52.github.io/idea-calendar-web/icon-512.png" />
  <meta property="og:image:width" content="512" />
  <meta property="og:image:height" content="512" />
  <meta property="og:url" content="https://ohandlee52.github.io/idea-calendar-web/" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary" />

  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>

  <!-- ───── 연결 설정 화면 (처음 한 번만) ───── -->
  <section id="setupView" class="login-view hidden">
    <div class="login-box">
      <div class="login-logo">⚙️</div>
      <h1>연결 설정</h1>
      <p class="login-sub">
        내 Supabase 정보를 한 번만 입력하면 됩니다.<br>
        (대시보드 → Settings → API)
      </p>
      <input id="setupUrl" type="url" inputmode="url" placeholder="Project URL (https://xxx.supabase.co)" />
      <input id="setupKey" type="text" placeholder="anon public 키" />
      <button id="setupSave" class="primary-btn big">저장하고 시작</button>
      <p class="login-msg">⚠️ secret / service_role 키는 넣지 마세요. 공개용 anon 키만 사용합니다.</p>
    </div>
  </section>

  <!-- ───── 로그인 화면 ───── -->
  <section id="loginView" class="login-view hidden">
    <div class="login-box">
      <div class="login-logo">💡</div>
      <h1>아이디어 캘린더</h1>
      <p class="login-sub">폰에서도 메모를 쓰고 볼 수 있어요</p>

      <!-- 구글 로그인. 비밀번호를 만들 필요가 없어 어르신들께 훨씬 쉽다. -->
      <button id="googleBtn" class="oauth-btn">
        <svg viewBox="0 0 18 18" width="18" height="18" aria-hidden="true">
          <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/>
          <path fill="#FBBC05" d="M3.97 10.72a5.4 5.4 0 0 1 0-3.44V4.95H.96a9 9 0 0 0 0 8.1l3.01-2.33z"/>
          <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.9 11.43 0 9 0A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/>
        </svg>
        <span>Google 계정으로 계속하기</span>
      </button>

      <!-- 카카오 로그인. 어르신들께는 카카오가 더 익숙하다. -->
      <button id="kakaoBtn" class="oauth-btn kakao">
        <svg viewBox="0 0 18 18" width="18" height="18" aria-hidden="true">
          <path fill="#000" d="M9 1.5C4.86 1.5 1.5 4.13 1.5 7.36c0 2.07 1.38 3.89 3.46 4.93l-.79 2.9c-.07.25.21.45.43.31l3.47-2.29c.3.03.62.05.93.05 4.14 0 7.5-2.62 7.5-5.9S13.14 1.5 9 1.5z"/>
        </svg>
        <span>카카오로 계속하기</span>
      </button>

      <div class="or-line"><span>또는 이메일로</span></div>

      <input id="loginEmail" type="email" inputmode="email" autocomplete="email"
             placeholder="이메일" />
      <input id="loginPw" type="password" autocomplete="current-password"
             placeholder="비밀번호 (6자 이상)" />
      <input id="loginInvite" type="text" autocomplete="off" autocapitalize="none"
             placeholder="초대코드 (계정 만들 때만 필요해요)" />

      <button id="loginBtn" class="primary-btn big">로그인</button>
      <button id="signupBtn" class="ghost-btn">처음이신가요? 계정 만들기</button>
      <button id="forgotBtn" class="link-btn">비밀번호를 잊으셨나요?</button>

      <p id="loginMsg" class="login-msg"></p>
    </div>
  </section>

  <!-- ───── 새 비밀번호 설정 (메일의 재설정 링크를 눌렀을 때만 뜸) ───── -->
  <section id="resetView" class="login-view hidden">
    <div class="login-box">
      <div class="login-logo">🔑</div>
      <h1>새 비밀번호 설정</h1>
      <p class="login-sub">새로 쓸 비밀번호를 입력해 주세요</p>

      <input id="resetPw" type="password" autocomplete="new-password"
             placeholder="새 비밀번호 (6자 이상)" />
      <input id="resetPw2" type="password" autocomplete="new-password"
             placeholder="새 비밀번호 확인" />

      <button id="resetSaveBtn" class="primary-btn big">바꾸고 시작하기</button>

      <p id="resetMsg" class="login-msg"></p>
    </div>
  </section>

  <!-- ───── 메인 화면 ───── -->
  <section id="mainView" class="main-view hidden">

    <header class="top-bar">
      <button id="menuBtn" class="icon-btn" title="메뉴">☰</button>
      <button id="topTitle" class="top-title-btn" title="달력 펼치기/접기"
              aria-expanded="false" aria-controls="calendarWrap">
        <span id="topTitleText">날짜를 선택하세요</span><span class="caret">▾</span>
      </button>
      <button id="searchBtn" class="icon-btn" title="검색">🔍</button>
    </header>

    <!-- 검색 줄 (검색 버튼을 누르면 나타남) -->
    <div id="searchBar" class="search-bar hidden">
      <input id="searchInput" type="search" placeholder="제목·내용·태그 검색" />
      <button id="searchClose" class="icon-btn">✕</button>
    </div>

    <!-- 오늘의 알림 -->
    <div id="reminderBar" class="reminder-bar hidden"></div>

    <!-- 달력 -->
    <div id="calendarWrap" class="calendar-wrap collapsed">
      <div class="cal-head">
        <button id="prevMonth" class="icon-btn">‹</button>
        <div id="monthLabel" class="month-label">0000년 0월</div>
        <button id="nextMonth" class="icon-btn">›</button>
        <button id="todayBtn" class="chip-btn">오늘</button>
      </div>
      <div class="weekdays">
        <span class="sun">일</span><span>월</span><span>화</span>
        <span>수</span><span>목</span><span>금</span><span class="sat">토</span>
      </div>
      <div id="daysGrid" class="days-grid"></div>
    </div>

    <!-- 바로 쓰기 — 스크롤해도 늘 붙어 있고, 한 번 눌러 바로 타이핑한다 -->
    <div class="quick-add">
      <input id="quickInput" class="qa-input" type="text"
             placeholder="무엇이 떠올랐나요?" enterkeyhint="done"
             autocomplete="off" autocapitalize="sentences" />
      <button id="quickSave" class="qa-save hidden" title="저장">저장</button>
      <button id="quickExpand" class="qa-expand" title="자세히 쓰기" aria-label="자세히 쓰기">자세히</button>
    </div>

    <!-- 메모 목록 -->
    <div class="list-head">
      <h2 id="listTitle" class="list-sub">날짜를 선택하세요</h2>
      <span id="syncStatus" class="sync-status"></span>
    </div>
    <div id="memoList" class="memo-list"></div>

    <!-- 선택 삭제 막대 — 하나라도 고르면 나타난다 -->
    <div id="selectBar" class="select-bar hidden">
      <span id="selectCount" class="sb-count">0개 선택</span>
      <button id="selectCancel" class="sb-btn">취소</button>
      <button id="selectDelete" class="sb-btn danger">삭제</button>
    </div>

    <!-- 새 메모 버튼 -->
    <button id="newMemoBtn" class="fab" title="새 메모"><span class="fab-plus">＋</span>메모</button>
  </section>

  <!-- ───── 메모 편집 화면 (전체 화면) ───── -->
  <section id="editView" class="edit-view hidden">
    <header class="top-bar">
      <button id="editBack" class="icon-btn">‹ 뒤로</button>
      <div id="editDate" class="top-title"></div>
      <button id="editDelete" class="icon-btn danger">🗑</button>
    </header>

    <div class="edit-body">
      <input id="memoTitle" class="edit-title" type="text" placeholder="제목" />
      <textarea id="memoBody" class="edit-content" placeholder="내용을 입력하세요..."></textarea>
      <div id="linkRow" class="link-row"></div>
      <input id="memoTags" class="edit-tags" type="text"
             placeholder="태그 (쉼표로 구분: 아이디어, 할일)" />

      <div class="edit-controls">
        <button id="pinBtn" class="chip-btn">📌 고정</button>
        <button id="addReminderBtn" class="chip-btn">🔔 알림 추가</button>
      </div>
      <div id="reminderRows" class="reminder-rows"></div>
      <div id="editMeta" class="edit-meta"></div>
    </div>
  </section>

  <!-- ───── 메뉴 (아래에서 올라옴) ───── -->
  <div id="sheet" class="sheet hidden">
    <div class="sheet-box">
      <div class="sheet-title" id="sheetTitle">메뉴</div>
      <button id="menuUpdate" class="sheet-item">⬆️ 앱 최신으로 업데이트</button>
      <button id="menuSync" class="sheet-item">🔄 새로고침 (동기화)</button>
      <button id="menuReport" class="sheet-item">📄 모아보기</button>
      <button id="menuImport" class="sheet-item">
        📥 PC 메모 가져오기
        <span class="sheet-sub">구글드라이브 → 아이디어캘린더-데이터 → idea-calendar-data.json</span>
      </button>
      <input id="importFile" type="file" accept=".json,application/json" hidden />
      <button id="menuLinkGoogle" class="sheet-item">🔗 구글 계정 연결하기</button>
      <button id="menuLinkKakao" class="sheet-item">🔗 카카오 계정 연결하기</button>
      <button id="menuSetup" class="sheet-item">⚙️ 연결 설정 바꾸기</button>
      <button id="menuLogout" class="sheet-item">🚪 로그아웃</button>
      <button id="sheetClose" class="sheet-item cancel">닫기</button>
    </div>
  </div>

  <!-- Supabase 라이브러리 (최신 2.x — 새 형식의 publishable 키도 지원) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="logic.js"></script>
  <script src="holidays.js"></script>
  <script src="app.js"></script>
</body>
</html>
